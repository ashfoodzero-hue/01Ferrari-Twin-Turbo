<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrari Twin Turbo — S/R Levels</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --up:#26a69a; --down:#ef5350; --accent:#d4a72c; --warn:#f0883e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0 12px 0 0; font-size:17px; font-weight:600; } h1 span { color:var(--accent); }
  .group { display:flex; gap:4px; flex-wrap:wrap; align-items:center; } .group small { color:var(--muted); margin-right:2px; }
  button, select { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:4px 9px; font:inherit; font-size:13px; cursor:pointer; }
  select { background:var(--panel); color:var(--text); }
  button:hover { color:var(--text); } button.on { background:#1f6feb22; color:var(--text); border-color:#1f6feb; }
  a { color:var(--muted); font-size:13px; } a:hover { color:var(--text); }
  #banner { display:none; padding:8px 16px; background:#5a1d1d; color:#fff; font-weight:600; animation:blink 1.2s step-start infinite; }
  @keyframes blink { 50% { background:#8b1e1e; } }
  main { display:grid; grid-template-columns:minmax(0, 1fr) 440px; flex:1; min-height:0; }
  #chart { min-width:0; min-height:0; position:relative; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px 14px; font-size:13px; }
  aside h2 { font-size:14px; margin:4px 0 8px; } aside h3 { font-size:13px; margin:14px 0 6px; color:var(--muted); font-weight:600; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:12px; }
  th, td { text-align:right; padding:3px 4px; border-bottom:1px solid var(--line); white-space:nowrap; } th:first-child, td:first-child { text-align:left; white-space:normal; }
  th { color:var(--muted); font-weight:600; }
  .pos { color:var(--up); } .neg { color:var(--down); } .mut { color:var(--muted); } .warn { color:var(--warn); }
  .verdict { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:0 0 10px; background:#0d1117; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); pointer-events:none; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; grid-template-rows:60% 40%; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Ferrari <span>Twin Turbo</span> · S/R Levels</h1>
  <div class="group" id="assets"></div>
  <div class="group" id="tfs"></div>
  <div class="group"><small>levels</small><select id="hist"><option value="a">alive only</option><option value="r" selected>alive + recently retired</option></select></div>
  <div class="group"><small>show</small><select id="range"><option value="150">150 candles</option><option value="300" selected>300 candles</option><option value="800">800 candles</option><option value="all">all</option></select></div>
  <a href="/" style="margin-left:auto">← live chart</a>
</header>
<div id="banner"></div>
<main>
  <div id="chart"><div id="msg">loading…</div></div>
  <aside id="side"></aside>
</main>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const st = { asset: 'xau', tf: '4H', data: null, series: [] }
try { const p = JSON.parse(localStorage.getItem('twinSR') || '{}'); if (p.asset) st.asset = p.asset; if (p.tf) st.tf = p.tf; if (p.hist) $('hist').value = p.hist; if (p.range) $('range').value = p.range } catch {}
const save = () => { try { localStorage.setItem('twinSR', JSON.stringify({ asset: st.asset, tf: st.tf, hist: $('hist').value, range: $('range').value })) } catch {} }
const chart = LightweightCharts.createChart($('chart'), { layout: { background: { color: '#0d1117' }, textColor: '#8b949e' }, grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
  rightPriceScale: { borderColor: '#30363d' }, timeScale: { borderColor: '#30363d', timeVisible: true }, crosshair: { mode: 0 }, autoSize: true })
const candles = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' })
const pct = (x) => (x == null ? '—' : Math.round(100 * x) + ' %'), pp = (x) => (x == null ? '—' : `${x >= 0 ? '+' : ''}${(100 * x).toFixed(1)}`)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]), hm = (s) => (s || '').slice(5, 16).replace('T', ' ')
$('assets').onclick = (e) => { const a = e.target.dataset.a; if (a) { st.asset = a; save(); load() } }
$('tfs').onclick = (e) => { const t = e.target.dataset.t; if (t) { st.tf = t; save(); load() } }
for (const id of ['hist', 'range']) $(id).onchange = () => { save(); draw(true) }
async function load() {
  $('msg').textContent = 'loading…'; $('msg').style.display = 'flex'
  const d = await fetch(`/api/sr?asset=${st.asset}&tf=${st.tf}`).then((r) => r.json()).catch((e) => ({ available: false, why: e.message }))
  $('assets').innerHTML = Object.entries(d.assets || {}).map(([k, n]) => `<button class="${k === st.asset ? 'on' : ''}" data-a="${k}">${n}</button>`).join('')
  $('tfs').innerHTML = (d.tfs || []).map((t) => `<button class="${t === st.tf ? 'on' : ''}" data-t="${t}">${t}</button>`).join('')
  if (!d.available) { st.data = null; candles.setData([]); clear(); $('msg').textContent = d.why || 'not available'; $('side').innerHTML = ''; $('banner').style.display = 'none'; return }
  st.data = d; $('msg').style.display = 'none'
  $('banner').style.display = d.stale ? 'block' : 'none'; $('banner').textContent = d.stale ? `⚠ S/R STALE — ${d.stale}. Levels below are the last good refresh; do not rely on them until this clears.` : ''
  candles.setData(d.candles.map(([t, o, h, l, c]) => ({ time: t / 1000, open: o, high: h, low: l, close: c })))
  draw(true); side()
}
function clear() { for (const s of st.series) chart.removeSeries(s); st.series = [] }
function draw(fit) {
  const d = st.data; if (!d) return; clear()
  const C = d.candles, n = $('range').value === 'all' ? C.length : Math.min(C.length, +$('range').value), from = C[C.length - n][0], last = C[C.length - 1][0], lastC = C[C.length - 1][4]
  let atr = 0; for (let k = Math.max(1, C.length - 14); k < C.length; k++) atr += Math.max(C[k][2] - C[k][3], Math.abs(C[k][2] - C[k - 1][4]), Math.abs(C[k][3] - C[k - 1][4])) / Math.min(14, C.length - 1)
  const alive = d.levels.filter((l) => l.end === 'open' && Math.abs(l.px - lastC) <= 8 * atr).sort((a, b) => Math.abs(a.px - lastC) - Math.abs(b.px - lastC)).slice(0, 24)
  const past = $('hist').value === 'r' ? d.levels.filter((l) => l.end !== 'open' && l.te >= from).sort((a, b) => b.te - a.te).slice(0, 20) : []
  const marks = []
  for (const l of [...past, ...alive]) { const isAlive = l.end === 'open', col = l.side_now === 's' ? '#26a69a' : '#ef5350', t0 = Math.max(l.tb, C[0][0]), t1 = isAlive ? last : l.te; if (!(t1 > t0)) continue
    const s = chart.addLineSeries({ color: isAlive ? col : col + '55', lineWidth: isAlive ? 2 : 1, lineStyle: l.flips?.length ? 2 : 0, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false, autoscaleInfoProvider: () => null })
    s.setData([{ time: t0 / 1000, value: l.px }, { time: t1 / 1000, value: l.px }]); st.series.push(s)
    for (const [t, o] of l.tch || []) if (t >= from && o !== 'o') marks.push({ time: t / 1000, position: l.px < lastC ? 'belowBar' : 'aboveBar', color: o === 'h' ? '#26a69a' : '#ef5350', shape: o === 'h' ? 'circle' : 'square', size: 0.4 }) }
  marks.sort((a, b) => a.time - b.time); candles.setMarkers(marks)
  if (fit) chart.timeScale().setVisibleRange({ from: from / 1000, to: last / 1000 })
  if ($('drawn')) $('drawn').textContent = `${alive.length} alive levels within 8 ATR + ${past.length} recently retired · last candle ${new Date(last).toISOString().slice(0, 16).replace('T', ' ')} UTC`
}
function side() {
  const d = st.data, L = d.live, M = d.measured, S = d.study_summary, a = M?.['all levels']?.all
  const strongN = S?.strong?.length ?? 0
  const verdict = `<b>${strongN ? 'Measured STRONG classes exist: ' + S.strong.map(esc).join(', ') : 'No kind of level is measured STRONG.'}</b> Over 6 years (${S?.kinds_tested ?? '—'} classes, 4 assets × 5 timeframes) no class of level held better than the same level shifted ±0.75 / ±1.5 ATR. Here (${esc(d.assets[st.asset])} ${esc(st.tf)}): real levels held ${pct(a?.real)} of tests vs ${pct(a?.placebo)} for shifted copies.`
  const lv = (L?.tf?.levels ?? []).slice(0, 12)
  const row = (l) => `<tr><td>${l.side_now === 'support' ? '<span class="pos">support</span>' : '<span class="neg">resistance</span>'}${l.phase ? ' <span class="mut">(flipped)</span>' : ''}</td><td>${l.px}</td><td>${l.dist_atr >= 0 ? '+' : ''}${l.dist_atr}</td><td>${l.record.held}/${l.record.tests}</td><td>${l.confluence}</td><td>${l.pending ? '<span class="warn">tested now</span>' : l.armed ? 'armed' : 'waiting 1 ATR away'}</td><td>${pct(l.measured?.[0]?.held)} <span class="mut">vs ${pct(l.measured?.[0]?.placebo)}</span></td></tr>`
  $('side').innerHTML = `<div class="verdict">${d.stale ? `<span class="neg"><b>STALE:</b> ${esc(d.stale)}</span><br>` : ''}${verdict}</div>
    <div class="verdict"><b>Feed</b> <span class="mut">· ${esc(L?.source ?? '—')}${L?.delayed ? ' · <span class="warn">DELAYED 10 min (Polygon plan) — never live</span>' : ''}</span>
      <br>levels refreshed ${esc(hm(L?.at))} UTC from minutes through ${esc(hm(L?.last_minute))} UTC · market ${d.market_open ? 'OPEN' : 'closed'}
      <br>health ${esc(d.health?.state ?? '—')} (${esc(hm(d.health?.at))}) ${(d.health?.issues ?? []).map((x) => `<br><span class="${x.sev === 'CRITICAL' ? 'neg' : 'warn'}">${esc(x.code)}: ${esc(x.text)}</span>`).join('')}</div>
    <h2>${esc(d.assets[st.asset])} ${esc(st.tf)} · alive levels near price</h2>
    <p class="mut" id="drawn"></p>
    <table><tr><th>Level</th><th>Price</th><th>ATR away</th><th>Held / tests</th><th>Confl.</th><th>State</th><th>Measured held</th></tr>${lv.map(row).join('') || '<tr><td colspan="7" class="mut">none within 10 ATR</td></tr>'}</table>
    <p class="mut">ATR away: + = price above the level. Held / tests = this level's own live record. Confl. = other timeframes with a level within 0.25 ATR(1D). Measured held = all ${esc(st.tf)} levels over 6 years vs their shifted copies.</p>
    <h3>Every strength class measured (held % real vs placebo, lift in points)</h3>
    ${M ? `<table><tr><th>Class</th><th>Tests</th><th>Real</th><th>Placebo</th><th>Lift (95 %)</th><th>First 3y</th><th>Last 3y</th></tr>${Object.entries(M).filter(([, v]) => v.all.n_real).map(([k, v]) => `<tr><td>${esc(k)}${v.described_only ? ' <span class="mut">(few)</span>' : ''}</td><td>${v.all.n_real}</td><td>${pct(v.all.real)}</td><td>${pct(v.all.placebo)}</td><td class="${v.all.lo > 0 ? 'pos' : v.all.hi < 0 ? 'neg' : 'mut'}">${pp(v.all.lift)} <small>(${pp(v.all.lo)}…${pp(v.all.hi)})</small></td><td>${v.train ? pp(v.train.lift) : 'n/a'}</td><td>${v.test ? pp(v.test.lift) : 'n/a'}</td></tr>`).join('')}</table>` : ''}
    <h3>How it is measured</h3>
    <p class="mut">A level = a confirmed swing of this timeframe (ZigZag 3×ATR), born when the swing is confirmed. A test HELD when price bounced 1 ATR before a candle closed 0.5 ATR through; a close-through flips the level (support ↔ resistance, dashed), a second one retires it. Refreshed every hour from the full Polygon history with the study's code. Study: <code>docs/SR_LEVELS_ATLAS.md</code>. Information only, not a signal.</p>`
  draw(false)
}
load(); setInterval(() => { if (document.visibilityState === 'visible') load() }, 5 * 60000)
</script>
</body>
</html>
