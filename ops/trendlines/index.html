<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrari Twin Turbo — Trendlines</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --up:#26a69a; --down:#ef5350; --accent:#d4a72c; --warn:#f0883e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0 12px 0 0; font-size:17px; font-weight:600; } h1 span { color:var(--accent); }
  .group { display:flex; gap:4px; flex-wrap:wrap; align-items:center; } .group small { color:var(--muted); margin-right:2px; }
  button, select { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:4px 9px; font:inherit; font-size:13px; cursor:pointer; }
  select { background:var(--panel); color:var(--text); }
  button:hover { color:var(--text); } button.on { background:#1f6feb22; color:var(--text); border-color:#1f6feb; }
  a { color:var(--muted); font-size:13px; } a:hover { color:var(--text); }
  main { display:grid; grid-template-columns:minmax(0, 1fr) 430px; flex:1; min-height:0; }
  #chart { min-width:0; min-height:0; position:relative; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px 14px; font-size:13px; }
  aside h2 { font-size:14px; margin:4px 0 8px; } aside h3 { font-size:13px; margin:14px 0 6px; color:var(--muted); font-weight:600; }
  table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; font-size:12px; }
  th, td { text-align:right; padding:3px 4px; border-bottom:1px solid var(--line); white-space:nowrap; } th:first-child, td:first-child { text-align:left; white-space:normal; }
  th { color:var(--muted); font-weight:600; }
  .pos { color:var(--up); } .neg { color:var(--down); } .mut { color:var(--muted); }
  .verdict { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:0 0 10px; background:#0d1117; }
  .legend span { display:inline-block; margin-right:10px; } .sw { display:inline-block; width:18px; height:0; border-top:2px solid; vertical-align:middle; margin-right:4px; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); pointer-events:none; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; grid-template-rows:60% 40%; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Ferrari <span>Twin Turbo</span> · Trendlines</h1>
  <div class="group" id="assets"></div>
  <div class="group" id="tfs"></div>
  <div class="group"><small>pivots</small><select id="scale"><option value="m">major (ZigZag 3×ATR)</option><option value="n">minor (fractal 5)</option><option value="b">both</option></select></div>
  <div class="group"><small>lines</small><select id="hist"><option value="a">active only</option><option value="r" selected>active + recent past</option></select></div>
  <div class="group"><small>show</small><select id="range"><option value="150">150 candles</option><option value="300" selected>300 candles</option><option value="800">800 candles</option><option value="all">all 6 years</option></select></div>
  <a href="/" style="margin-left:auto">← live chart</a>
</header>
<main>
  <div id="chart"><div id="msg">loading…</div></div>
  <aside id="side"></aside>
</main>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $ = (id) => document.getElementById(id)
const st = { asset: 'xau', tf: '4H', data: null, series: [] }
try { Object.assign(st, JSON.parse(localStorage.getItem('twinTL') || '{}'), { data: null, series: [] }) } catch {}
const save = () => { try { localStorage.setItem('twinTL', JSON.stringify({ asset: st.asset, tf: st.tf, scale: $('scale').value, hist: $('hist').value, range: $('range').value })) } catch {} }
try { const p = JSON.parse(localStorage.getItem('twinTL') || '{}'); if (p.scale) $('scale').value = p.scale; if (p.hist) $('hist').value = p.hist; if (p.range) $('range').value = p.range } catch {}
const chart = LightweightCharts.createChart($('chart'), { layout: { background: { color: '#0d1117' }, textColor: '#8b949e' }, grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
  rightPriceScale: { borderColor: '#30363d' }, timeScale: { borderColor: '#30363d', timeVisible: true }, crosshair: { mode: 0 }, autoSize: true })
const candles = chart.addCandlestickSeries({ upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350' })
const pct = (x) => (x == null ? '—' : Math.round(100 * x) + ' %'), pp = (x) => (x == null ? '—' : `${x >= 0 ? '+' : ''}${(100 * x).toFixed(1)}`)
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])

function buttons(assets, tfs) {
  $('assets').innerHTML = Object.entries(assets).map(([k, n]) => `<button class="${k === st.asset ? 'on' : ''}" data-a="${k}">${n}</button>`).join('')
  $('tfs').innerHTML = tfs.map((t) => `<button class="${t === st.tf ? 'on' : ''}" data-t="${t}">${t}</button>`).join('')
}
$('assets').onclick = (e) => { const a = e.target.dataset.a; if (a) { st.asset = a; save(); load() } }
$('tfs').onclick = (e) => { const t = e.target.dataset.t; if (t) { st.tf = t; save(); load() } }
for (const id of ['scale', 'hist', 'range']) $(id).onchange = () => { save(); draw(true) }

async function load() {
  $('msg').textContent = 'loading…'; $('msg').style.display = 'flex'
  const d = await fetch(`/api/trendlines?asset=${st.asset}&tf=${st.tf}`).then((r) => r.json()).catch((e) => ({ available: false, why: e.message }))
  buttons(d.assets || { xau: 'XAU', xag: 'Silver', dxy_ice: 'DXY', wti: 'WTI' }, d.tfs || ['1W', '1D', '4H', '1H'])
  if (!d.available) { st.data = null; candles.setData([]); clearLines(); $('msg').textContent = d.why || 'not available'; $('side').innerHTML = ''; return }
  st.data = d; $('msg').style.display = 'none'
  candles.setData(d.candles.map(([t, o, h, l, c]) => ({ time: t / 1000, open: o, high: h, low: l, close: c })))
  draw(true); side()
}
function clearLines() { for (const s of st.series) chart.removeSeries(s); st.series = [] }
function draw(fit) {
  const d = st.data; if (!d) return; clearLines()
  const C = d.candles, n = $('range').value === 'all' ? C.length : Math.min(C.length, +$('range').value), from = C[C.length - n][0], last = C[C.length - 1][0]
  const sc = $('scale').value, okS = (l) => sc === 'b' || (sc === 'm' ? l.s === 'm' : l.s === 'n')
  // display choice (not a study rule): active lines are drawn only while they are within 5 ATR(14) of the last close — far-away lines are not in play
  let atr = 0; for (let k = Math.max(1, C.length - 14); k < C.length; k++) atr += Math.max(C[k][2] - C[k][3], Math.abs(C[k][2] - C[k - 1][4]), Math.abs(C[k][3] - C[k - 1][4])) / Math.min(14, C.length - 1)
  const lastC = C[C.length - 1][4]
  const live = d.lines.filter((l) => okS(l) && l.end === 'open' && Math.abs(l.pe - lastC) <= 5 * atr).sort((a, b) => b.tb - a.tb).slice(0, 30)
  const past = $('hist').value === 'r' ? d.lines.filter((l) => okS(l) && l.end !== 'open' && l.te >= from).sort((a, b) => b.te - a.te).slice(0, 30) : []
  const marks = []
  for (const l of [...past, ...live]) { if (l.te <= l.t1) continue
    const active = l.end === 'open', col = l.sd === 's' ? '#26a69a' : '#ef5350'
    const s = chart.addLineSeries({ color: active ? col : col + '55', lineWidth: active ? 2 : 1, lineStyle: l.c === 't' ? 0 : 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false, autoscaleInfoProvider: () => null })
    s.setData([{ time: l.t1 / 1000, value: l.p1 }, { time: l.te / 1000, value: l.pe }]); st.series.push(s)
    for (const [t, , o] of l.tch) if (t >= from && o !== 'o') marks.push({ time: t / 1000, position: l.sd === 's' ? 'belowBar' : 'aboveBar', color: o === 'r' ? '#26a69a' : '#ef5350', shape: o === 'r' ? 'circle' : 'square', size: 0.4 }) }
  marks.sort((a, b) => a.time - b.time); candles.setMarkers(marks)
  if (fit) chart.timeScale().setVisibleRange({ from: from / 1000, to: last / 1000 })
  if ($('drawn')) $('drawn').textContent = `${live.length} active lines within 5 ATR of price + ${past.length} past lines drawn · last candle ${new Date(last).toISOString().slice(0, 16).replace('T', ' ')} UTC`
}
function side() {
  const d = st.data, M = d.measured, wti = d.symbol === 'WTI'
  const best = M ? Object.entries(M).filter(([k, v]) => k !== 'all lines' && v.all.lo != null && v.all.lo > 0) : []
  const a = M?.['all lines']?.all
  const verdict = !M ? 'The report has not been generated yet (report_trendlines.mjs).'
    : best.length ? `Kinds that beat their placebo copies here (95 % lower bound &gt; 0): ${best.map(([k]) => esc(k)).join(', ')}.${d.study_summary ? ` <b>Caution:</b> over all ${d.study_summary.kinds_tested} kinds tested (4 assets × 4 timeframes), ${d.study_summary.holm_more} survive the correction for testing so many, and ${d.study_summary.pass} pass "better in both halves" vs ${d.study_summary.mirror_chance_level} that pass "worse in both halves": this is the level of chance.` : ''}`
    : `<b>No kind of trendline here beats its placebo copies.</b> Real lines bounced ${pct(a?.real)} of touches, lines shifted ±0.75 / ±1.5 ATR bounced ${pct(a?.placebo)}: price treats a trendline like any other line.`
  const row = (k, v) => `<tr><td>${esc(k)}</td><td>${v.all.n_real}</td><td>${pct(v.all.real)}</td><td>${pct(v.all.placebo)}</td><td class="${v.all.lo > 0 ? 'pos' : v.all.hi < 0 ? 'neg' : 'mut'}">${pp(v.all.lift)} <small>(${pp(v.all.lo)}…${pp(v.all.hi)})</small></td><td>${v.train ? pp(v.train.lift) : 'n/a'}</td><td>${v.test ? pp(v.test.lift) : 'n/a'}</td></tr>`
  const LA = d.live_alerts, ico = { AT: '📐', BOUNCED: '✅', BROKEN: '❌' }, fmtT = (s) => (s || '').slice(5, 16).replace('T', ' ')
  const liveBox = !LA ? '<div class="verdict mut">Live major-line alerts (4H / 1D): the minute check has not run yet.</div>'
    : `<div class="verdict"><b>🔔 Live major-line alerts (4H + 1D)</b> <span class="mut">· checked ${esc(fmtT(LA.at))} UTC${LA.stale ? ' · <span class="neg">not running now (market closed or app restarting)</span>' : ''}</span>
      ${LA.blocked ? `<br><span class="neg">BLOCKED: ${esc(LA.blocked)} — computed and shown here, never sent.</span>` : ''}
      <br><span class="mut">${esc(LA.status)}${LA.price ? ` · price ${LA.price}` : ''}</span>
      ${['4H', '1D'].map((tf) => { const T = LA.tf?.[tf]; const n = (T?.lines_near ?? []).slice(0, 3); return T ? `<br><b>${tf}</b> <span class="mut">${esc(T.status)}</span>${n.map((x) => `<br>&nbsp;· major ${esc(x.side)} (${esc(x.cls)}) ${x.value} · ${x.dist_atr >= 0 ? '+' : ''}${x.dist_atr} ATR${x.pending ? ' · touched, waiting for bounce / break' : x.armed ? ' · armed' : ''}`).join('')}` : '' }).join('')}
      ${LA.recent?.length ? '<br><br><b>Last 7 days</b>' + LA.recent.slice(0, 8).map((x) => `<br>${ico[x.type] || ''} ${esc(fmtT(x.at))} ${esc(x.tf)} major ${esc(x.side)} ${x.value} ${x.sent ? '' : `<span class="mut">(${esc(x.not_sent || 'not sent')})</span>`}`).join('') : '<br><span class="mut">no alerts in the last 7 days</span>'}</div>`
  $('side').innerHTML = `${liveBox}<h2>${esc(d.assets[st.asset])} ${esc(st.tf)} · measured over ${wti ? 'its 2 years' : '6 years'}</h2>
    <div class="verdict">${verdict}${d.walk_forward_pass?.length ? `<br><br>Holds in BOTH the first 3 and the last 3 years: ${d.walk_forward_pass.map(esc).join('; ')}` : ''}</div>
    <div class="legend"><span><i class="sw" style="border-color:#26a69a"></i>support</span><span><i class="sw" style="border-color:#ef5350"></i>resistance</span><span>solid = trend line · dashed = counter / channel line</span><br>
    <span>bright = active (unbroken) · faded = ended</span><span><b class="pos">●</b> touch respected · <b class="neg">■</b> touch broken</span></div>
    <p class="mut" id="drawn"></p>
    <h3>Lift = real respected % − placebo respected % (percentage points)</h3>
    ${M ? `<table><tr><th>Kind of line</th><th>Touches</th><th>Real</th><th>Placebo</th><th>Lift (95 %)</th><th>First 3y</th><th>Last 3y</th></tr>${Object.entries(M).map(([k, v]) => row(k, v)).join('')}</table>` : ''}
    <h3>How it is measured</h3>
    <p class="mut">Lines are drawn by a fixed rule: two confirmed pivots of the same type, no candle closing through the line between them; a line exists only from the candle that confirmed its second pivot. A touch is <b>respected</b> when price bounces 1 ATR before a candle closes 0.25 ATR through. Each real line is copied 4× shifted ±0.75 / ±1.5 ATR (placebo) and tested by the same rules. Study: <code>docs/TRENDLINE_STUDY_ATLAS.md</code>. Study run ${esc((d.at || '').slice(0, 16).replace('T', ' '))} UTC · report ${esc((d.measured_at || '').slice(0, 16).replace('T', ' '))} UTC.${wti ? ' WTI: Polygon keeps ≈ 2 years of futures, so WTI is described only (no first / last 3-year split).' : ''} Information only, not a signal.</p>`
  draw(false)
}
load()
</script>
</body>
</html>
